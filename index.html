<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Deacon Medical 大阪自由行菜单 · 10/9–10/10">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>大阪两日漫游手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --paper:#FBF6F3; --surface:#FFFFFF; --ink:#2A2130; --muted:#786A74; --line:#EBDDE1;
  --accent:#D6405A; --accent-ink:#FFFFFF; --accent-soft:#FBE4E8;
  --walk:#2F7D5B; --walk-soft:#E1F1E8; --ride:#3D58A6; --ride-soft:#E4E9F7; --past:#8A6A2E; --past-soft:#F5ECDA;
  --tip:#FFF4DA; --tip-ink:#6B5210; --warn:#B4441F; --warn-soft:#FCE7DE;
  --shadow:0 1px 2px rgba(60,20,40,.06),0 6px 20px rgba(60,20,40,.06);
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#18131C; --surface:#231C29; --ink:#F3EAF0; --muted:#B2A2AD; --line:#3A2F40;
    --accent:#F2718A; --accent-ink:#1E1017; --accent-soft:#3B2231;
    --walk:#7BCFA6; --walk-soft:#1E3329; --ride:#93A7EC; --ride-soft:#232B47; --past:#E3C27E; --past-soft:#352D1C;
    --tip:#35301F; --tip-ink:#F2DC9A; --warn:#F59A78; --warn-soft:#3D241B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#18131C; --surface:#231C29; --ink:#F3EAF0; --muted:#B2A2AD; --line:#3A2F40;
  --accent:#F2718A; --accent-ink:#1E1017; --accent-soft:#3B2231;
  --walk:#7BCFA6; --walk-soft:#1E3329; --ride:#93A7EC; --ride-soft:#232B47; --past:#E3C27E; --past-soft:#352D1C;
  --tip:#35301F; --tip-ink:#F2DC9A; --warn:#F59A78; --warn-soft:#3D241B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lang-en{font-family:var(--jp)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--jp);font-variant-numeric:tabular-nums}

/* Cover */
.cover{padding-block:24px 18px;display:grid;gap:14px}
.cover-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-family:var(--jp);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex:none}
.lang button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
h1{margin:0;font-size:30px;line-height:1.2;font-weight:900;text-wrap:balance;letter-spacing:-.01em}
.lang-en h1{font-size:27px}
.cover p{margin:0;color:var(--muted);max-width:34em}
.ticket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:12px 16px}
.ticket .d{display:grid}
.ticket .d b{font-family:var(--jp);font-size:20px;font-variant-numeric:tabular-nums}
.ticket .d span{font-size:12px;color:var(--muted)}
.ticket .d:last-child{text-align:right}
.ticket .mid{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.ticket .rail{width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 10px)}
.base{background:var(--ink);color:var(--paper);border-radius:20px;padding:16px;display:grid;gap:10px}
.base small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-family:var(--jp);font-weight:700}
.base h2{margin:0;font-size:18px;line-height:1.3}
.base p{margin:0;font-size:13px;opacity:.8}
.base .btn,.gohome .btn{border-color:var(--paper);background:transparent;color:var(--paper)}
.base .btn.primary,.gohome .btn.primary{background:var(--paper);color:var(--ink)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;border-bottom:1px solid var(--line);margin-top:16px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:2px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-family:var(--jp)}

/* Explore */
.moods{display:flex;gap:6px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.pill{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;font-weight:500}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.group-h{display:grid;gap:0;margin:20px 0 10px}
.group-h h2{margin:0;font-size:18px;font-weight:900}
.group-h span{font-size:12.5px;color:var(--muted)}
.areas{display:grid;gap:10px}
.area{width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:6px;transition:transform .15s ease}
.area:active{transform:scale(.985)}
.area-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dist{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--walk-soft);color:var(--walk)}
.dist.ride{background:var(--ride-soft);color:var(--ride)}
.dist.past{background:var(--past-soft);color:var(--past)}
.area .count{font-size:12px;color:var(--muted)}
.area h3{margin:0;font-size:18px;line-height:1.3;font-weight:700;text-wrap:balance}
.area p{margin:0;font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;background:var(--accent-soft);padding:1px 9px;border-radius:999px}
.tag.xhs{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tag.classic{background:var(--ink);color:var(--paper)}
.tag.queue{background:var(--warn-soft);color:var(--warn)}
.tag.cheap{background:var(--walk-soft);color:var(--walk)}
.ph{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sm{aspect-ratio:16/10;border-radius:12px}
.ph .demo{position:absolute;left:8px;bottom:8px;background:rgba(20,12,20,.72);color:#FFFFFF;font-size:11px;padding:1px 8px;border-radius:999px}
.area .ph{margin:-4px -6px 4px;width:calc(100% + 12px);max-width:none}
.s-hero{margin-bottom:12px}
.ol .ph{margin-top:6px}
.credits summary{cursor:pointer;font-weight:700;font-size:14px}
.credits ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
.credits li{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.modeseg{margin-top:14px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.cat{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14.5px}
.cat small{font-family:var(--jp);font-weight:700;font-size:12px;color:var(--muted);background:var(--paper);border-radius:999px;padding:0 8px}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat[aria-pressed="true"] small{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
.item .ph{aspect-ratio:1/1;border-radius:12px}
.item .ph .demo{left:4px;bottom:4px;font-size:9.5px;padding:0 5px}
.item b{display:block;font-size:15px;line-height:1.3}
.item .meta{display:block;font-size:12px;color:var(--muted);margin:2px 0 4px}
.noimg{aspect-ratio:1/1;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:900;font-size:18px}
.place.flash{outline:3px solid var(--accent);outline-offset:2px;transition:outline-color 1.2s}
.warnline{margin:0;font-weight:900;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.tag.michelin{background:#B3142B;color:#FFFFFF;font-weight:700}
.empty{color:var(--muted);font-size:13.5px;padding:20px 0}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:580px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{position:sticky;top:0;background:var(--paper);padding:10px 0 6px;display:flex;z-index:1}
.grab i{width:40px;height:4px;border-radius:4px;background:var(--line);position:absolute;left:0;right:0;top:8px;margin:0 auto}
.close{margin-left:auto;margin-top:8px;background:var(--surface);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.s-head{display:grid;gap:6px;padding-bottom:14px}
.s-head h2{margin:0;font-size:24px;line-height:1.25;font-weight:900;text-wrap:balance}
.s-head p{margin:0}
.addto{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.addto span{font-size:12.5px;color:var(--muted)}
.addto button{border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.addto button[aria-pressed="true"]{border-style:solid;background:var(--accent);color:var(--accent-ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;margin-bottom:18px}
.box b{font-size:13px}
.box p{margin:0;font-size:13.5px}
.sec{margin-block:0 18px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--jp);font-weight:700}
.places{display:grid;gap:10px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.place-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.place h5{margin:0;font-size:16px;line-height:1.35}
.place .jpn{font-family:var(--jp);font-size:12.5px;color:var(--muted)}
.place p{margin:0;font-size:13.5px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:500}
.kind{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.heart{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.heart[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);text-align:center;line-height:1.25}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.full{grid-column:1 / -1}
.tip{background:var(--tip);color:var(--tip-ink);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.tip p{margin:0;font-size:13.5px}
.gohome{display:grid;gap:8px;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px}
.gohome b{font-size:14px}

/* Panels */
.panel{padding-block:18px 0;display:grid;gap:14px}
.panel h2{margin:0;font-size:21px;font-weight:900;text-wrap:balance}
.panel > p{margin:0;color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;display:grid;line-height:1.3}
.seg button small{font-size:11.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--jp);font-weight:700;margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px;line-height:1.3}
.pk b{font-size:14px}
.pk small{font-size:11.5px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pk[aria-pressed="true"] b::before{content:"✓ ";color:var(--accent)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan-h h3{margin:0;font-size:17px}
.clear{border:0;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline}
.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s;position:relative;padding-bottom:14px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--jp);font-weight:900;font-size:13px;position:relative;z-index:1}
.steps li.home::before{content:"⌂";background:var(--accent);color:var(--accent-ink)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.steps .t{font-family:var(--jp);font-size:12.5px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.steps b{display:block;font-size:15px}
.steps .d{font-size:12.5px;color:var(--muted);display:block}
.steps .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;text-align:left;text-decoration:none}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin:0}
.fullday{background:var(--ink);color:var(--paper);border-radius:18px;padding:16px;display:grid;gap:8px}
.fullday h3{margin:0;font-size:18px}
.fullday p{margin:0;font-size:13.5px;opacity:.85}
.fullday .btn{border-color:var(--paper);background:var(--paper);color:var(--ink)}

/* Day trips */
.trip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.trip-h{display:grid;gap:6px}
.trip-h h3{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.trip-h p{margin:0;font-size:14px}
.ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:o}
.ol li{display:grid;grid-template-columns:26px 1fr;gap:10px;counter-increment:o}
.ol li::before{content:counter(o);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--jp);font-weight:900;font-size:13px}
.ol b{display:block;font-size:14.5px}
.ol span{font-size:13.5px;color:var(--muted)}
.must{display:grid;gap:6px}
.must div{display:flex;gap:8px;font-size:13.5px}
.must div::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px}

/* Info */
.info{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.info h3{margin:0;font-size:16px}
.info p,.info li{margin:0;font-size:13.5px}
.info ul{margin:0;padding-left:18px;display:grid;gap:4px}
.tel{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.tel:first-of-type{border-top:0;padding-top:0}
.tel .who{font-size:13px;color:var(--muted)}
.tel b{font-family:var(--jp);font-variant-numeric:tabular-nums;user-select:all;font-size:15.5px}
.tel button{grid-row:1 / span 2;grid-column:2;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.phrase:first-of-type{border-top:0}
.phrase .jp{font-family:var(--jp);font-weight:700;font-size:16px}
.phrase .ro{font-size:12px;color:var(--muted)}
.phrase .mean{font-size:12.5px;color:var(--muted)}
.phrase button{grid-row:1 / span 3;grid-column:2;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:12px;padding-top:28px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;display:flex;gap:6px;align-items:center}
.driver{position:fixed;inset:0;z-index:40;background:#FFFFFF;color:#111111;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.driver-in{display:grid;gap:20px;text-align:center;max-width:520px}
.driver .hint{font-size:13px;color:#666666;font-family:var(--zh);margin:0}
.driver .jp{font-family:var(--jp);font-size:clamp(28px,8.5vw,44px);font-weight:900;line-height:1.45;text-wrap:balance;margin:0}
.driver .addr{font-family:var(--jp);font-size:17px;color:#333333;margin:0}
.driver .sub{font-family:var(--jp);font-size:18px;color:#333333;margin:0}
.driver .dbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.driver .dbtns a,.driver .dbtns button{border:2px solid #111111;border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
.driver .dbtns button{background:#111111;color:#FFFFFF}

/* ---------- Route planner ---------- */
function orderPlan(ids){
  const sel = ids.map(byId).filter(Boolean);
  const rest = sel.filter(a => a.slot !== "eve").sort((x,y) => x.pos - y.pos);
  const eve = sel.filter(a => a.slot === "eve").sort((x,y) => y.pos - x.pos);
  let t = 9.5, prev = null; const out = [];
  [...rest, ...eve].forEach(a => {
    if (prev) t += Math.abs(a.pos - prev.pos) >= 3 ? 0.75 : 0.5; else t += Math.abs(a.pos) >= 3 ? 0.5 : 0.25;
    let wait = false;
    if (a.id === "skybldg" && t < 17) { t = 17; wait = true; }
    if (a.id === "dotonbori" && t < 18) { t = 18; wait = true; }
    out.push({a, start:t, wait, prev});
    t += a.hrs; prev = a;
  });
  const warns = [];
  out.forEach(s => {
    if (s.a.id === "sumiyoshi" && s.start > 15.5) warns.push({zh:"住吉大社 17:00 关门，这样排可能来不及。",en:"Sumiyoshi Taisha closes at 17:00; this may be too late."});
    if (s.a.id === "kuromon" && s.start > 14.5) warns.push({zh:"黑门市场下午很多摊位开始收，建议早点去。",en:"Many Kuromon stalls close in the afternoon. Go earlier if you can."});
  });
  if (t > 22) warns.push({zh:"这天有点满，可以删掉一两个，或者分到另一天。",en:"This day is packed. Drop one or two, or move some to the other day."});
  return {steps:out, end:t, warns};
}

  } else {
    const r = orderPlan(ids);
    const pick = AREAS.map(a => `<button class="pk" type="button" data-pick="${a.id}" aria-pressed="${ids.includes(a.id)}"><b>${esc(short(a))}</b><small>${esc(a.visited?L(a.visited):L(a.dist))}</small></button>`).join("");
    const result = ids.length ? `<div class="plan">
      <div class="plan-h"><h3>${esc(L(UI[planDay]))} · ${zh?"推荐顺序":"Best order"}</h3><button class="clear" type="button" data-clear>${zh?"清空":"Clear"}</button></div>
      ${r.warns.map(w=>`<div class="warn">${esc(L(w))}</div>`).join("")}
      <ol class="steps">
        ${r.steps.map(s => `<li><div><span class="t">${hhmm(s.start)}</span><b>${esc(L(s.a.name))}</b>
          <span class="d">${zh?"停留约":"Stay ~"} ${s.a.hrs} ${zh?"小时":"hrs"}${s.wait?(zh?" · 为了看日落 / 夜景，中间的空档可以回酒店休息":" · timed for sunset/night; rest at the hotel in between"):""}</span>
          <span class="links"><a class="link" href="${dirUrl(s.a.q, (s.prev && Math.abs(s.a.pos-s.prev.pos)<=1.2) || (!s.prev && s.a.group==="walk") ? "walking" : "transit", s.prev ? s.prev.q : null)}" target="_blank" rel="noopener">${ICON.map} ${s.prev?(zh?"从上一站去这里":"From previous stop"):(zh?"从这里出发":"Start here")}</a>
          <button class="link" type="button" data-area="${s.a.id}">${zh?"看推荐店家":"See picks"}</button></span></div></li>`).join("")}
        <li class="home"><div><span class="t">~${hhmm(r.end + 0.5)}</span><b>${zh?"回酒店":"Back to the hotel"}</b>
          <span class="links"><a class="link" href="${dirUrl(HOTEL.maps,"transit")}" target="_blank" rel="noopener">${ICON.map} ${zh?"导航回酒店":"Directions"}</a><button class="link" type="button" data-hotel>${zh?"出租车卡":"Taxi card"}</button></span></div></li>
      </ol>
      <a class="btn primary" href="${"https://www.google.com/maps/dir/" + [HOTEL.maps, ...r.steps.map(s=>s.a.q), HOTEL.maps].map(encodeURIComponent).join("/")}" target="_blank" rel="noopener">${ICON.map}${zh?"在 Google Maps 看整条路线":"See the whole route in Google Maps"}</a>
      <p class="note">${zh?"整条路线用来看方向就好；Google Maps 多站路线常常默认显示开车。真正出发时，用每一站的「从上一站去这里」看搭车方法。":"Use the whole-route map for an overview; multi-stop routes often default to driving. For trains, use each stop's \"From previous stop\" link."}</p>
    </div>` : `<p class="empty">${zh?"在上面选几个想去的地方，或点一个现成组合。":"Pick a few places above, or tap a ready-made combo."}</p>`;
    body = `<p class="label">${zh?"现成组合":"Ready-made combos"}</p>
      <div class="row">${PRESETS.map((p,i)=>`<button class="pill" type="button" data-preset="${i}">${esc(L(p.name))}</button>`).join("")}</div>
      <p class="label">${zh?`自己选（最多 ${MAX} 个）· 已选 ${ids.length}`:`Choose your own (up to ${MAX}) · ${ids.length} picked`}</p>
      <div class="pick">${pick}</div>${result}`;
  }
  return `<section class="panel">
    <h2>${zh?"选几个地方，帮你排好顺序":"Pick a few places, we'll sort the order"}</h2>
    <p>${zh?"按南北方向排、不走回头路，也会照顾营业时间：神社排早上，夜景排傍晚。两天可以各配一条。":"Ordered north–south with no backtracking, and timed sensibly: shrines in the morning, views in the evening. Plan each day separately."}</p>
    <div class="seg" role="group">${["d9","d10"].map(d=>`<button type="button" data-day="${d}" aria-pressed="${planDay===d}">${esc(L(UI[d]))}<small>${plans.full[d]?esc(L(TRIPS.find(x=>x.id===plans.full[d]).name)):(plans[d].length?(zh?`${plans[d].length} 个地方`:`${plans[d].length} places`):(zh?"还没安排":"Not planned"))}</small></button>`).join("")}</div>
    <p class="label">${zh?"这天要去一整天的地方吗？":"A full-day trip this day?"}</p>
    <div class="row">
      <button class="pill" type="button" data-full="" aria-pressed="${!full}">${zh?"不用，我自己配":"No, I'll mix"}</button>
      ${TRIPS.map(tr=>`<button class="pill" type="button" data-full="${tr.id}" aria-pressed="${full===tr.id}" ${plans.full[other]===tr.id?"disabled":""}>${esc(L(tr.name))}</button>`).join("")}
    </div>
    ${body}
  </section>`;
}

function renderTrips(){
  const zh = lang === "zh";
  return `<section class="panel"><h2>${zh?"想跑远一点？一整天的行程":"Going further? Full-day trips"}</h2>
    <p>${zh?"选了之后，在「配路线」把那天设成一日游就好。两个都是团体行程没去过的。":"Choose one, then set that day as a day trip in Plan. Neither is on the group tour."}</p>
    ${TRIPS.map(tr=>`<article class="trip" id="trip-${tr.id}">
      ${photo(tr.img)}<div class="trip-h"><h3>${esc(L(tr.name))}</h3><p>${esc(L(tr.lead))}</p></div>
      <div class="box" style="margin:0"><b>${esc(L(tr.best))}</b></div>
      <div class="sec" style="margin:0"><h4>${esc(L(UI.fromHotel))}</h4><div class="box" style="margin:0"><p>${esc(L(tr.how))}</p>
        <div class="actions" style="margin-top:8px"><a class="btn primary full" href="${dirUrl(tr.destQ,"transit")}" target="_blank" rel="noopener">${ICON.map}${esc(L(UI.takeMe))}</a></div></div></div>
      <div class="sec" style="margin:0"><h4>${esc(L(tr.stepsTitle))}</h4><ol class="ol">${tr.steps.map(s=>`<li><div><b>${esc(L(s.t))}</b><span>${esc(L(s.d))}</span>${photo(s.img,"sm")}</div></li>`).join("")}</ol></div>
      <div class="sec" style="margin:0"><h4>${esc(L(tr.mustTitle))}</h4><div class="must">${L(tr.must).map(m=>`<div>${esc(m)}</div>`).join("")}</div></div>
      <div class="tip">${L(tr.tips).map(t=>`<p>${esc(t)}</p>`).join("")}</div>
      <div class="actions">
        <button class="btn" type="button" data-setfull="${tr.id}" data-d="d9">${zh?"排在 10/9":"Plan for 9 Oct"}</button>
        <button class="btn" type="button" data-setfull="${tr.id}" data-d="d10">${zh?"排在 10/10":"Plan for 10 Oct"}</button>
        ${tr.link?`<a class="btn full" href="${tr.link.url}" target="_blank" rel="noopener">${esc(L(tr.link.label))}</a>`:""}
      </div>
    </article>`).join("")}
  </section>`;
}

function renderSaved(){
  const items = AREAS.flatMap(a => a.places.map((p,i)=>({a,p,i}))).filter(x => saved[pid(x.a,x.i)]);
  const zh = lang === "zh";
  return `<section class="panel"><h2>${zh?"我的收藏":"Saved places"}</h2>
    <p>${zh?"在店家右上角按 ♡ 就会存到这里。收藏只存在你自己的手机上。":"Tap ♡ on any place to save it here. Saves stay on your own phone."}</p>
    ${items.length ? `<div class="places">${items.map(x=>placeCard(x.a,x.p,x.i,true)).join("")}</div>` : `<p class="empty">${zh?"还没有收藏。去「逛逛」挑几家吧。":"Nothing saved yet. Browse Explore and tap ♡."}</p>`}
  </section>`;
}

function renderInfo(){
  const zh = lang === "zh";
  return `<section class="panel"><h2>${zh?"旅行须知":"Travel info"}</h2>
    <div class="info"><h3>${zh?"联络我们":"Contact us"}</h3>
      ${CONTACTS.map(c=>`<div class="tel"><span class="who">${esc(L(c))}</span><b>${esc(L(c.v))}</b>${/\d/.test(L(c.v))?`<button type="button" data-copy="${esc(L(c.v))}">${esc(L(UI.copy))}</button>`:""}</div>`).join("")}</div>
    <div class="info"><h3>${zh?"酒店地址":"Hotel address"}</h3>
      <p><b>${esc(HOTEL.name)}</b></p><p class="num">${esc(HOTEL.addr)}</p><p style="font-family:var(--jp)">${esc(HOTEL.addrJp)}</p>
      <div class="actions"><a class="btn primary" href="${dirUrl(HOTEL.maps,"walking")}" target="_blank" rel="noopener">${ICON.map}${esc(L(UI.walkHome))}</a>
      <button class="btn" type="button" data-hotel>${ICON.taxi}${esc(L(UI.taxiHome))}</button></div></div>
    <div class="info"><h3>${zh?"紧急电话":"Emergency"}</h3>
      <div class="tel"><span class="who">${zh?"警察":"Police"}</span><b>110</b></div>
      <div class="tel"><span class="who">${zh?"救护车 / 火警":"Ambulance / Fire"}</span><b>119</b></div>
      <div class="tel"><span class="who">${zh?"日本游客热线（24 小时，中英文）":"Japan Visitor Hotline (24h, EN/CN)"}</span><b>050-3816-2787</b></div></div>
    <div class="info"><h3>${zh?"天气与穿搭":"Weather"}</h3>
      <p>${zh?"约 17–27°C，天气偏干。带防风外套、润唇膏和乳液，穿好走的鞋，折叠伞放包里。":"About 17–27°C and dry. Bring a windbreaker, lip balm and lotion, comfy shoes and a folding umbrella."}</p></div>
    <div class="info"><h3>${zh?"交通":"Getting around"}</h3><ul>
      <li>${zh?"最近的车站：惠美须町站（堺筋线、阪堺电车），走路 2 分钟。":"Nearest: Ebisucho (Sakaisuji Line, Hankai tram), 2 min walk."}</li>
      <li>${zh?"去梅田、天王寺的御堂筋线：走约 8 分钟到动物园前站。":"Midosuji Line to Umeda or Tennoji: Dobutsuen-mae, about 8 min walk."}</li>
      <li>${zh?"去 USJ 的 JR：走约 10 分钟到新今宫站。":"JR for USJ: Shin-Imamiya, about 10 min walk."}</li>
      <li>${zh?"ICOCA、Suica 等交通卡地铁、JR、电车都能用，iPhone 可以加到钱包。":"ICOCA, Suica and similar IC cards work everywhere; iPhone users can add one to Wallet."}</li></ul></div>
    <div class="info"><h3>${zh?"免税购物":"Tax-free shopping"}</h3><ul>
      <li>${zh?"同一家店、同一天、税前满 ¥5,000，结账时出示护照原件。":"Same store, same day, ¥5,000+ before tax. Show your original passport."}</li>
      <li>${zh?"10 月还是在店里直接免税（日本 11 月起才改成出境时退税）。":"In October it's still deducted at the till (refund-at-departure starts in November)."}</li>
      <li>${zh?"免税的消耗品会封袋，离开日本前不要拆。":"Tax-free consumables come sealed. Don't open them in Japan."}</li></ul></div>
    <div class="info"><h3>${zh?"救急日语":"Handy Japanese"}</h3>
      ${PHRASES.map(p=>`<div class="phrase"><span class="jp">${esc(p.jp)}</span><span class="ro">${esc(p.ro)}</span><span class="mean">${esc(L(p))}</span><button type="button" data-jp="${esc(p.jp)}" data-plain>${zh?"放大":"Show"}</button></div>`).join("")}</div>
    <details class="info credits"><summary>${zh?"照片来源":"Photo credits"}</summary>
      <p class="note">${zh?"照片来自 Wikimedia Commons，依各自的授权使用。标示「示意图」的是同一道菜的参考照片，不一定是那家店。":"Photos from Wikimedia Commons, used under their licences. Items marked \"Similar dish\" show the dish, not necessarily that restaurant."}</p>
      <ul>${Object.entries(PHOTOS).map(([k,p])=>`<li><a href="${esc(p.u)}" target="_blank" rel="noopener">${esc(k)}</a> · ${esc(p.a)} · ${esc(p.l)}</li>`).join("")}</ul>
    </details>
  </section>`;
}

function render(){
  renderStatic();
  const v = document.getElementById("view");
  v.innerHTML = {plan:renderPlan, trips:renderTrips, saved:renderSaved, info:renderInfo}[tab]?.() ?? renderExplore();
  if (openArea) renderSheet(openArea);
}

function renderSheet(id){
  const a = byId(id), zh = lang === "zh";
  document.getElementById("sheet").innerHTML = `
    <div class="grab"><i></i><button class="close" type="button" id="sheet-close" aria-label="Close">×</button></div>
    <div class="s-hero">${photo(a.img)}</div>
    <div class="s-head"><span class="dist ${a.group==="ride"?"ride":a.group==="past"?"past":""}" style="justify-self:start">${esc(a.visited?L(a.visited)+" · "+L(a.dist):L(a.dist))}</span>
      <h2 id="sheet-title">${esc(L(a.name))}</h2><p>${esc(L(a.blurb))}</p></div>
    <div class="addto"><span>${esc(L(UI.addTo))}</span>${["d9","d10"].map(d=>`<button type="button" data-addto="${d}" data-id="${a.id}" aria-pressed="${plans[d].includes(a.id)}" ${plans.full[d]?"disabled":""}>${esc(L(UI[d]))}</button>`).join("")}</div>
    <div class="box"><b>${esc(L(UI.fromHotel))}</b><p>${esc(L(a.how))}</p></div>
    <div class="sec"><h4>${esc(L(UI.picks))}</h4><div class="places">${a.places.map((p,i)=>placeCard(a,p,i,false)).join("")}</div></div>
    <div class="sec"><h4>${esc(L(UI.tips))}</h4><div class="tip">${L(a.tips).map(t=>`<p>${esc(t)}</p>`).join("")}</div></div>
    <div class="gohome"><b>${esc(L(UI.goHome))}</b><div class="actions">
      <a class="btn primary" href="${dirUrl(HOTEL.maps, a.mode)}" target="_blank" rel="noopener">${ICON.map}${esc(L(UI.walkHome))}</a>
      <button class="btn" type="button" data-hotel>${ICON.taxi}${esc(L(UI.taxiHome))}</button></div></div>`;
}
function openSheet(id){
  openArea = id; renderSheet(id);
  const sh = document.getElementById("sheet");
  sh.classList.add("open"); sh.setAttribute("aria-hidden","false"); sh.scrollTop = 0;
  document.getElementById("scrim").classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(()=>document.getElementById("sheet-close")?.focus({preventScroll:true}), 50);
}
function closeSheet(){
  const id = openArea; openArea = null;
  const sh = document.getElementById("sheet");
  sh.classList.remove("open"); sh.setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("open");
  document.body.style.overflow = "";
  document.querySelector(`[data-area="${id}"]`)?.focus({preventScroll:true});
}

let wake = null;
async function showDriver(jp, addr, q){
  document.getElementById("driver-jp").textContent = jp;
  const ad = document.getElementById("driver-addr"); ad.textContent = addr || ""; ad.hidden = !addr;
  const m = document.getElementById("driver-map"); m.hidden = !q; if (q) m.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  document.getElementById("driver").hidden = false;
  document.getElementById("driver-close").focus();
  try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {}
}
function hideDriver(){ document.getElementById("driver").hidden = true; try { wake?.release(); } catch(e) {} wake = null; }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 1800); }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }

function togglePick(day, id){
  const zh = lang === "zh", list = plans[day];
  if (list.includes(id)) plans[day] = list.filter(x => x !== id);
  else if (list.length >= MAX) { toast(zh?`一天最多选 ${MAX} 个`:`Up to ${MAX} per day`); return; }
  else { plans[day] = [...list, id]; toast(zh?`已加入 ${L(UI[day])}`:`Added to ${L(UI[day])}`); }
  persist();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-mood],[data-exmode],[data-cat],[data-dish],[data-goto],[data-area],[data-save],[data-jp],[data-hotel],[data-copy],[data-pick],[data-preset],[data-day],[data-full],[data-setfull],[data-addto],[data-clear],#fab,#sheet-close,#scrim,#driver-close,#lang-zh,#lang-en");
  if (!t || t.disabled) return;
  const zh = lang === "zh", d = t.dataset;
  if (d.tab){ if (openArea) closeSheet(); tab = d.tab; history.replaceState(null,"","#"+tab); render(); window.scrollTo({top:document.getElementById("tabs").offsetTop - 4}); }
  else if (d.mood){ mood = d.mood; render(); }
  else if (d.exmode){ exMode = d.exmode; store.set("osaka-exmode", exMode); keepScroll(render); }
  else if (d.cat){ exCat = d.cat; exDish = "all"; keepScroll(render); }
  else if (d.dish){ exDish = d.dish; keepScroll(render); }
  else if (d.goto){ const [aid, idx] = d.goto.split("|"); openSheet(aid);
    setTimeout(() => { const el = document.getElementById(`pl-${aid}-${idx}`); if (!el) return; const sh = document.getElementById("sheet");
      sh.scrollTop = el.offsetTop - 60; el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1600); }, 80); }
  else if (d.area){ if (openArea){ openArea = d.area; renderSheet(openArea); document.getElementById("sheet").scrollTop = 0; } else openSheet(d.area); }
  else if (d.save){ saved[d.save] = !saved[d.save]; store.set("osaka-saved", saved); keepScroll(render); toast(saved[d.save]?(zh?"已收藏":"Saved"):(zh?"已取消收藏":"Removed")); }
  else if (d.pick){ togglePick(planDay, d.pick); keepScroll(render); }
  else if (d.addto){ togglePick(d.addto, d.id); keepScroll(render); }
  else if (d.preset !== undefined){ plans[planDay] = [...PRESETS[+d.preset].ids]; persist(); keepScroll(render); }
  else if (d.clear !== undefined){ plans[planDay] = []; persist(); keepScroll(render); }
  else if (d.day){ planDay = d.day; keepScroll(render); }
  else if (d.full !== undefined){ plans.full[planDay] = d.full || null; persist(); keepScroll(render); }
  else if (d.setfull){ const o = d.d === "d9" ? "d10" : "d9"; if (plans.full[o] === d.setfull) plans.full[o] = null; plans.full[d.d] = d.setfull; persist(); planDay = d.d; tab = "plan"; render(); window.scrollTo({top:document.getElementById("tabs").offsetTop - 4}); }
  else if (d.hotel !== undefined || t.id === "fab") showDriver(HOTEL.jp + "までお願いします。", HOTEL.addrJp, HOTEL.maps);
  else if (d.jp) showDriver(d.jp, "", d.plain !== undefined ? "" : d.q);
  else if (d.copy){ try { navigator.clipboard.writeText(d.copy).then(()=>toast(L(UI.copied)), ()=>selectText(t)); } catch(err){ selectText(t); } }
  else if (t.id === "sheet-close" || t.id === "scrim") closeSheet();
  else if (t.id === "driver-close") hideDriver();
  else if (t.id === "lang-zh" || t.id === "lang-en"){ lang = t.id === "lang-zh" ? "zh" : "en"; store.set("osaka-lang", lang); render(); }
});
function selectText(btn){ const b = btn.parentElement.querySelector("b"); if (!b) return; const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!document.getElementById("driver").hidden) hideDriver(); else if (openArea) closeSheet(); });

(function init(){
  lang = store.get("osaka-lang") || ((navigator.language||"").toLowerCase().startsWith("zh") ? "zh" : "en");
  if (!plans.full) plans.full = {d9:null,d10:null};
  exMode = store.get("osaka-exmode") || "cat";
  const h = location.hash.slice(1);
  if (["explore","plan","trips","saved","info"].includes(h)) tab = h;
  render();
})();
</script>

</body>
</html>
